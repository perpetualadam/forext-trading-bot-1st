name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
        env:
          EXECUTION_MODE: paper
          TRADING_MODE: practice
          PAPER_TRADING: "true"

  offline-exposure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated offline exposure contract
        run: python -I -S -B offline_exposure/run_checks.py

  trading-intelligence-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated synthetic trading intelligence checks
        run: python -I -S -B data/research/trading_intelligence_v2/run.py --tests

  trading-intelligence-v22-mtf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated multi-timeframe research checks
        run: python -I -S -B data/research/trading_intelligence_v2/run.py --mtf-tests
