services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    ports:
      # Default 8001 avoids clashing with other stacks on 8000; override with BOT_PORT in .env
      - "${BOT_PORT:-8001}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      TRADING_MODE: ${TRADING_MODE:-practice}
      EXECUTION_MODE: ${EXECUTION_MODE:-}
      PAPER_TRADING: ${PAPER_TRADING:-}
      KILL_SWITCH: ${KILL_SWITCH:-}
      STRICT_EXECUTION: ${STRICT_EXECUTION:-}
      RECONCILE_INTERVAL_SEC: ${RECONCILE_INTERVAL_SEC:-}
      HEALTH_SNAPSHOT_INTERVAL_SEC: ${HEALTH_SNAPSHOT_INTERVAL_SEC:-}
      DAILY_REPORT_INTERVAL_SEC: ${DAILY_REPORT_INTERVAL_SEC:-}
      RECONCILE_MAX_AGE_SEC: ${RECONCILE_MAX_AGE_SEC:-}
      BLOCK_NEW_ENTRIES_ON_RECONCILE_MISMATCH: ${BLOCK_NEW_ENTRIES_ON_RECONCILE_MISMATCH:-}
      REQUIRE_CLEAN_RECONCILE_FOR_BROKER: ${REQUIRE_CLEAN_RECONCILE_FOR_BROKER:-}
      SKIP_RECONCILE_GATE_FOR_BROKER: ${SKIP_RECONCILE_GATE_FOR_BROKER:-}
      PERSIST_RECONCILE_STATE: ${PERSIST_RECONCILE_STATE:-}
      OPERATIONAL_EVENT_MAX: ${OPERATIONAL_EVENT_MAX:-}
      PERSIST_OPERATIONAL_EVENTS: ${PERSIST_OPERATIONAL_EVENTS:-}
      LOAD_OPERATIONAL_EVENTS_FROM_DB: ${LOAD_OPERATIONAL_EVENTS_FROM_DB:-}
      RECONCILE_ON_RESUME: ${RECONCILE_ON_RESUME:-}
      RECONCILE_ACTION: ${RECONCILE_ACTION:-}
      RECONCILE_AUTO_FIX_IN_PAPER: ${RECONCILE_AUTO_FIX_IN_PAPER:-}
      RECONCILE_IMPORT_BROKER_POSITIONS: ${RECONCILE_IMPORT_BROKER_POSITIONS:-}
      RECONCILE_ADJUST_UNITS: ${RECONCILE_ADJUST_UNITS:-}
      RECONCILE_MAX_FIXES_PER_CYCLE: ${RECONCILE_MAX_FIXES_PER_CYCLE:-}
      PERSIST_EXEC_ORDERS: ${PERSIST_EXEC_ORDERS:-}
      MAX_GROSS_USD_NOTIONAL: ${MAX_GROSS_USD_NOTIONAL:-}
      EXECUTION_METRICS_MAX_SAMPLES: ${EXECUTION_METRICS_MAX_SAMPLES:-}
      SLIPPAGE_ATR_FRACTION: ${SLIPPAGE_ATR_FRACTION:-}
      POSITION_RISK_PCT: ${POSITION_RISK_PCT:-}
      POSITION_RISK_PCT_MAX: ${POSITION_RISK_PCT_MAX:-}
      MIN_POSITION_HOLD_SEC: ${MIN_POSITION_HOLD_SEC:-}
      POSITION_LOG: ${POSITION_LOG:-}
      PERFORMANCE_LOG: ${PERFORMANCE_LOG:-}
      PERFORMANCE_LOG_INTERVAL_SEC: ${PERFORMANCE_LOG_INTERVAL_SEC:-}
      MAX_PORTFOLIO_RISK_PCT: ${MAX_PORTFOLIO_RISK_PCT:-}
      MAX_POSITION_UNITS: ${MAX_POSITION_UNITS:-}
      MIN_STOP_DISTANCE_PRICE: ${MIN_STOP_DISTANCE_PRICE:-}
      USE_ATR_STOPS: ${USE_ATR_STOPS:-}
      SL_ATR_MULT: ${SL_ATR_MULT:-}
      SPREAD_MULTIPLIER: ${SPREAD_MULTIPLIER:-}
      SLIPPAGE_MULTIPLIER: ${SLIPPAGE_MULTIPLIER:-}
      LATENCY_MS: ${LATENCY_MS:-}
      MARKET_IMPACT_FACTOR: ${MARKET_IMPACT_FACTOR:-}
      OANDA_ACCESS_TOKEN: ${OANDA_ACCESS_TOKEN:-}
      OANDA_API_KEY: ${OANDA_API_KEY:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_MAX_CANDLES_PER_REQUEST: ${OANDA_MAX_CANDLES_PER_REQUEST:-}
      OANDA_CHUNK_DELAY_SEC: ${OANDA_CHUNK_DELAY_SEC:-}
      OANDA_MAX_RETRIES: ${OANDA_MAX_RETRIES:-}
      USE_OANDA_LIVE: ${USE_OANDA_LIVE:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-}
      AI_DISABLE_STUB: ${AI_DISABLE_STUB:-}
      ENSEMBLE_MODE: ${ENSEMBLE_MODE:-}
      NN_PRED_MODE: ${NN_PRED_MODE:-}
      STUB_SMA_EPSILON: ${STUB_SMA_EPSILON:-}
      STUB_MOMENTUM_THRESHOLD: ${STUB_MOMENTUM_THRESHOLD:-}
      STUB_CONFIDENCE_SCALE: ${STUB_CONFIDENCE_SCALE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-}
      ANTHROPIC_TIMEOUT: ${ANTHROPIC_TIMEOUT:-}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-}
      GROK_MODEL: ${GROK_MODEL:-}
      XAI_MODEL: ${XAI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      VENICE_API_KEY: ${VENICE_API_KEY:-}
      VENICE_BASE_URL: ${VENICE_BASE_URL:-}
      VENICE_MODEL: ${VENICE_MODEL:-}
      VENICE_JSON_MODE: ${VENICE_JSON_MODE:-}
      QROK_API_KEY: ${QROK_API_KEY:-}
      QROK_BASE_URL: ${QROK_BASE_URL:-}
      QROK_MODEL: ${QROK_MODEL:-}
      QROK_JSON_MODE: ${QROK_JSON_MODE:-}
      HYBRID_EUR_USD: ${HYBRID_EUR_USD:-}
      HYBRID_GBP_USD: ${HYBRID_GBP_USD:-}
      HYBRID_USD_JPY: ${HYBRID_USD_JPY:-}
      SCALP_LOOKBACK: ${SCALP_LOOKBACK:-}
      SWING_LOOKBACK: ${SWING_LOOKBACK:-}
      DEFAULT_INDICATOR_LOOKBACK: ${DEFAULT_INDICATOR_LOOKBACK:-}
      HYBRID_ROUTE_LOOKBACK: ${HYBRID_ROUTE_LOOKBACK:-}
      HYBRID_ATR_SCALP_THRESHOLD: ${HYBRID_ATR_SCALP_THRESHOLD:-}
      HYBRID_OHLCV_COUNT: ${HYBRID_OHLCV_COUNT:-}
      LIVE_EUR_USD_START: ${LIVE_EUR_USD_START:-}
      LIVE_EUR_USD_END: ${LIVE_EUR_USD_END:-}
      LIVE_GBP_USD_START: ${LIVE_GBP_USD_START:-}
      LIVE_GBP_USD_END: ${LIVE_GBP_USD_END:-}
      LIVE_USD_JPY_START: ${LIVE_USD_JPY_START:-}
      LIVE_USD_JPY_END: ${LIVE_USD_JPY_END:-}
      SCALP_EUR_USD_START: ${SCALP_EUR_USD_START:-}
      SCALP_EUR_USD_END: ${SCALP_EUR_USD_END:-}
      SCALP_GBP_USD_START: ${SCALP_GBP_USD_START:-}
      SCALP_GBP_USD_END: ${SCALP_GBP_USD_END:-}
      SCALP_USD_JPY_START: ${SCALP_USD_JPY_START:-}
      SCALP_USD_JPY_END: ${SCALP_USD_JPY_END:-}
      SIMULATION_EUR_USD: ${SIMULATION_EUR_USD:-}
      SIMULATION_GBP_USD: ${SIMULATION_GBP_USD:-}
      SIMULATION_USD_JPY: ${SIMULATION_USD_JPY:-}
      FOREX_BACKTEST: ${FOREX_BACKTEST:-}
      BACKTEST_CSV: ${BACKTEST_CSV:-}
      BACKTEST_SEED: ${BACKTEST_SEED:-}
      BACKTEST_STEP_BARS: ${BACKTEST_STEP_BARS:-}
      BACKTEST_FAST_WINDOW: ${BACKTEST_FAST_WINDOW:-}
      BACKTEST_INDICATOR_WINDOW: ${BACKTEST_INDICATOR_WINDOW:-}
    depends_on:
      db:
        condition: service_healthy

  # Optional local LLM — not started unless you use profile "ollama":
  #   docker compose --profile ollama up -d
  # Then in .env point the bot at the in-network URL (see .env.example).
  ollama:
    profiles:
      - ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
